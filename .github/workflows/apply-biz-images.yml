name: Apply Business Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/apply_biz_images.py'
      - '.github/workflows/apply-biz-images.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow

      - name: Refresh business thumbnails from CMS
        run: python3 scripts/apply_biz_images.py

      - name: Commit refreshed thumbnails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/products/*.jpg
          if git diff --staged --quiet; then
            echo "No thumbnail changes to commit."
          else
            git commit -m "fix(biz): replace PCB/broken default thumbnails with real product photos [skip ci]"
            git push
          fi
