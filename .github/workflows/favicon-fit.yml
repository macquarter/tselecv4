name: Favicon Fit
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/favicon-fit.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: pip install pillow
      - name: Regenerate favicons from the square logo mark (contain, no crop)
        run: |
          python3 - <<'PYEOF'
          import re, base64, io, os
          from PIL import Image

          # Source = the square logo mark embedded in the original favicon.svg
          # (this is the mark the customer's favicon always used; transparent PNG).
          sp="public/favicon.svg"
          svg=open(sp,encoding="utf-8").read()
          m=re.search(r'data:image/[a-zA-Z0-9.+-]+;base64,([^"\'`)\s]+)', svg)
          assert m, "no embedded PNG data URI found in favicon.svg"
          b64=re.sub(r'[^A-Za-z0-9+/=]', '', m.group(1))
          logo=Image.open(io.BytesIO(base64.b64decode(b64))).convert("RGBA")
          amin=logo.getchannel("A").getextrema()[0]
          assert amin < 255, f"source mark is not transparent (alpha min={amin})"
          bbox=logo.getbbox()
          assert bbox, "source mark is fully transparent / empty"
          logo=logo.crop(bbox)  # trim empty margins so 'contain' uses real content
          w,h=logo.size
          print(f"source mark: {w}x{h}  aspect={w/h:.3f}  alpha_min={amin}")

          # contain = min-scale => the whole logo always fits, never cropped.
          # small pad so the mark fills the tile as much as possible without touching edges.
          def make(size, pad_ratio=0.05):
              canvas=Image.new("RGBA",(size,size),(0,0,0,0))
              inner=size*(1-2*pad_ratio)
              scale=min(inner/w, inner/h)
              nw,nh=max(1,int(round(w*scale))),max(1,int(round(h*scale)))
              r=logo.resize((nw,nh),Image.LANCZOS)
              canvas.paste(r,((size-nw)//2,(size-nh)//2),r)
              return canvas

          for fn,sz in [("favicon-32.png",32),("favicon.png",64),
                        ("apple-touch-icon.png",180),("icon-192.png",192),("icon-512.png",512)]:
              img=make(sz)
              assert img.getchannel("A").getextrema()[0]==0, "generated favicon not transparent: "+fn
              # sanity: rendered logo must fit strictly inside the tile (never cropped)
              lb=img.getbbox()
              assert lb and lb[0]>=1 and lb[1]>=1 and lb[2]<=sz-1 and lb[3]<=sz-1, "logo touches/exceeds edge: "+fn
              img.save("public/"+fn)
              print("wrote public/"+fn, sz, "logo bbox", lb)
          print("all favicons regenerated with contain (no crop) OK")
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(favicon): use square logo mark, contain fit so logo is never cropped [skip ci]" || echo "no changes"
          git push
