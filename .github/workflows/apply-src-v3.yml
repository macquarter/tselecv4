name: apply-src-v3
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-src-v3.yml'
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Transform sources
        run: |
          echo "" | base64 -d > /tmp/t.py
          python3 /tmp/t.py
      - name: Build verify
        run: |
          npm ci || npm install
          npm run build
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/pages/Certifications.tsx src/pages/Organization.tsx
          git commit -m "org: remove CEO block; certs: add curated small-text points per card [skip ci]" || echo "no-op"
          git push
