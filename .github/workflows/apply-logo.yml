name: Apply Logo
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Write tsLogo.ts from sha-verified base64
        run: |
          python3 - <<'PYEOF'
          import base64, hashlib
          B64 = ""
          EXPECT = "6c9db20238e628bbdfac4ff4f1eec1a65d854a9c799e5033ca630e0f705d7fe6"
          raw = base64.b64decode(B64)
          got = hashlib.sha256(raw).hexdigest()
          assert got == EXPECT, f"SHA MISMATCH {got} != {EXPECT}"
          content = (
              "// 태승전자 공식 로고 (고객 제공 원본 PNG, 무수정 그대로 임베드)\n"
              "// 320x69 투명 배경 RGBA. 아트워크 변경/재작성 없음 — 원본 바이트 그대로 base64.\n"
              "// sha256(원본): %s\n"
              "const tsLogo = 'data:image/png;base64,%s';\n\nexport default tsLogo;\n"
          ) % (EXPECT, B64)
          open("src/assets/tsLogo.ts","w",encoding="utf-8").write(content)
          print("wrote src/assets/tsLogo.ts", len(content), "chars; png", len(raw), "bytes; sha OK")
          PYEOF
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/assets/tsLogo.ts
          git commit -m "fix(logo): embed exact customer full logo PNG, byte-exact no redraw [skip ci]" || echo "no changes"
          git push